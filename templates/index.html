<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume & Portfolio Builder</title>
    <!-- 정적 CSS 스타일시트 연결 -->
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- PWA 설정 메타태그 & 매니페스트 연결 -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#34495E">
    <link rel="apple-touch-icon" href="/static/img/icon-192.png">
</head>
<body>
    <div class="container">
        <!-- 헤더 영역 -->
        <header class="app-header">
            <h1>AI Resume & Portfolio Builder</h1>
            <p class="subtitle">구글 Gemini AI가 당신의 경험을 바탕으로 완벽한 이력서와 포트폴리오를 작성해 드립니다.</p>
        </header>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content">
            <!-- 1. 입력 폼 영역 -->
            <section class="form-card">
                <h2>정보 입력하기</h2>
                <form id="resume-form" novalidate>
                    <!-- 이름 입력 -->
                    <div class="form-group">
                        <label for="name"><span class="icon-tag">👤</span> 이름 <span class="required">*</span></label>
                        <input type="text" id="name" name="name" placeholder="예: 홍길동" required>
                    </div>

                    <!-- 지원 직무 입력 -->
                    <div class="form-group">
                        <label for="job-title"><span class="icon-tag">💼</span> 지원 직무 <span class="required">*</span></label>
                        <input type="text" id="job-title" name="job_title" placeholder="예: 백엔드 개발자, 서비스 기획자, 데이터 분석가" required>
                    </div>

                    <!-- 경력 사항 입력 -->
                    <div class="form-group">
                        <label for="experience"><span class="icon-tag">📜</span> 주요 경력 및 이력 <span class="required">*</span></label>
                        <textarea id="experience" name="experience" rows="4" placeholder="회사명, 담당 업무, 재직 기간, 주요 역할 등을 자유롭게 적어주세요.&#10;예: (주)한국소프트웨어 백엔드 개발 1년 6개월, REST API 설계 및 데이터베이스 최적화 담당" required></textarea>
                    </div>

                    <!-- 주요 프로젝트 입력 -->
                    <div class="form-group">
                        <label for="projects"><span class="icon-tag">🚀</span> 핵심 프로젝트 경험 <span class="required">*</span></label>
                        <textarea id="projects" name="projects" rows="5" placeholder="진행한 프로젝트의 이름, 목표, 사용 기술, 본인의 기여도 및 결과 성과를 적어주세요.&#10;예: 전자상거래 웹 서비스 구축 프로젝트 (Flask, PostgreSQL 사용, 응답 속도 30% 개선)" required></textarea>
                    </div>

                    <!-- Tone(어조) 선택 -->
                    <div class="form-group">
                        <label for="tone"><span class="icon-tag">🎨</span> 문서 어조 (Tone)</label>
                        <select id="tone" name="tone">
                            <option value="전문적이고 신뢰감 있는" selected>전문적이고 신뢰감 있는 (기본 추천)</option>
                            <option value="자신감 있고 적극적인">자신감 있고 적극적인</option>
                            <option value="차분하고 정중한">차분하고 정중한</option>
                            <option value="열정적이고 창의적인">열정적이고 창의적인</option>
                        </select>
                    </div>

                    <!-- 이력서 디자인 양식(템플릿) 선택 (총 6종) -->
                    <div class="form-group">
                        <label><span class="icon-tag">📑</span> 이력서 디자인 양식 선택 (6개 샘플 중 선택)</label>
                        <div class="template-selector-grid">
                            <!-- 1. 블루 열정 타임라인형 -->
                            <label class="template-card active" data-template="blue_timeline">
                                <input type="radio" name="template_style" value="blue_timeline" checked>
                                <div class="template-img-wrap">
                                    <img src="/static/img/tpl_blue_timeline.png" alt="블루 타임라인형 양식" class="template-thumb">
                                    <span class="template-badge badge-blue">헤드라인형</span>
                                    <span class="select-check">✓</span>
                                </div>
                                <div class="template-desc">
                                    <strong>1. 블루 열정 타임라인</strong>
                                    <span>대형 슬로건 + 타임라인형 경력 + 역량 바</span>
                                </div>
                            </label>

                            <!-- 2. 버건디 클래식 세리프형 -->
                            <label class="template-card" data-template="burgundy_classic">
                                <input type="radio" name="template_style" value="burgundy_classic">
                                <div class="template-img-wrap">
                                    <img src="/static/img/tpl_burgundy_classic.png" alt="버건디 클래식형 양식" class="template-thumb">
                                    <span class="template-badge badge-burgundy">고급 클래식</span>
                                    <span class="select-check">✓</span>
                                </div>
                                <div class="template-desc">
                                    <strong>2. 버건디 클래식 세리프</strong>
                                    <span>우아한 상단 와인 배너 + 좌측 사이드바 2단</span>
                                </div>
                            </label>

                            <!-- 3. 소프트 민트 사이드바형 -->
                            <label class="template-card" data-template="mint_sidebar">
                                <input type="radio" name="template_style" value="mint_sidebar">
                                <div class="template-img-wrap">
                                    <img src="/static/img/tpl_mint_sidebar.png" alt="소프트 민트 사이드바형 양식" class="template-thumb">
                                    <span class="template-badge badge-mint">신입/스타트업</span>
                                    <span class="select-check">✓</span>
                                </div>
                                <div class="template-desc">
                                    <strong>3. 소프트 민트 2단형</strong>
                                    <span>산뜻한 민트 사이드바 + 균형 잡힌 실무 구성</span>
                                </div>
                            </label>

                            <!-- 4. 볼드 옐로우 & 블랙형 -->
                            <label class="template-card" data-template="yellow_bold">
                                <input type="radio" name="template_style" value="yellow_bold">
                                <div class="template-img-wrap">
                                    <img src="/static/img/tpl_yellow_bold.png" alt="볼드 옐로우 블랙형 양식" class="template-thumb">
                                    <span class="template-badge badge-yellow">트렌디 힙</span>
                                    <span class="select-check">✓</span>
                                </div>
                                <div class="template-desc">
                                    <strong>4. 볼드 옐로우 & 블랙</strong>
                                    <span>다크 헤더 + 옐로우 포인트 + 포트폴리오형</span>
                                </div>
                            </label>

                            <!-- 5. 코퍼레이트 스탠다드형 -->
                            <label class="template-card" data-template="corporate_gray">
                                <input type="radio" name="template_style" value="corporate_gray">
                                <div class="template-img-wrap">
                                    <img src="/static/img/tpl_corporate_gray.png" alt="코퍼레이트 스탠다드형 양식" class="template-thumb">
                                    <span class="template-badge badge-gray">대기업/공채</span>
                                    <span class="select-check">✓</span>
                                </div>
                                <div class="template-desc">
                                    <strong>5. 코퍼레이트 스탠다드</strong>
                                    <span>깔끔한 그레이 톤 + 신뢰감 있는 표준 표 양식</span>
                                </div>
                            </label>

                            <!-- 6. 스카이블루 비비드 스토리형 -->
                            <label class="template-card" data-template="skyblue_story">
                                <input type="radio" name="template_style" value="skyblue_story">
                                <div class="template-img-wrap">
                                    <img src="/static/img/tpl_skyblue_story.png" alt="스카이블루 비비드형 양식" class="template-thumb">
                                    <span class="template-badge badge-skyblue">스토리텔링</span>
                                    <span class="select-check">✓</span>
                                </div>
                                <div class="template-desc">
                                    <strong>6. 스카이블루 스토리형</strong>
                                    <span>밝고 긍정적인 자기소개 + 핵심 역량 하이라이트</span>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- Prompt 모드 선택 -->
                    <div class="form-group">
                        <label><span class="icon-tag">⚙️</span> 작성 모드 (프롬프트 선택)</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="prompt_type" value="A" checked>
                                <span><strong>Prompt A (일반 모드)</strong>: 읽기 쉽고 단정한 표준 이력서 (신입 및 주니어 추천)</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="prompt_type" value="B">
                                <span><strong>Prompt B (전문가 모드)</strong>: STAR 기법 및 수치 성과 중심의 임팩트 이력서 (경력직 추천)</span>
                            </label>
                        </div>
                    </div>

                    <!-- 생성 버튼 -->
                    <button type="submit" id="submit-btn" class="btn btn-primary">✨ AI 이력서 & 포트폴리오 생성하기</button>
                </form>
            </section>

            <!-- 2. 오류 메시지 표시 영역 -->
            <div id="error-box" class="alert alert-error" style="display: none;"></div>

            <!-- 3. 로딩 상태 표시 영역 -->
            <div id="loading-box" class="loading-container" style="display: none;">
                <div class="spinner"></div>
                <p class="loading-text">Gemini AI가 이력서와 포트폴리오를 맞춤 작성 중입니다.<br>잠시만 기다려 주세요 (약 5~10초 소요)</p>
            </div>

            <!-- 4. 생성 결과 표시 영역 -->
            <section id="result-box" class="result-container" style="display: none;">
                <div class="result-header">
                    <h2>AI 작성 결과</h2>
                    <div class="action-buttons">
                        <button type="button" id="copy-resume-btn" class="btn btn-secondary">📋 이력서 복사</button>
                        <button type="button" id="copy-portfolio-btn" class="btn btn-secondary">📋 포트폴리오 복사</button>
                        <button type="button" id="download-md-btn" class="btn btn-success">📥 마크다운(.md) 다운로드</button>
                    </div>
                </div>

                <!-- 이력서 결과 카드 -->
                <div class="result-card">
                    <div class="card-header">
                        <h3><span class="icon-tag icon-resume">📄</span> 이력서 (Resume)</h3>
                    </div>
                    <div class="card-body">
                        <div id="resume-output" class="content-preview"></div>
                    </div>
                </div>

                <!-- 포트폴리오 결과 카드 -->
                <div class="result-card">
                    <div class="card-header">
                        <h3><span class="icon-tag icon-portfolio">📁</span> 포트폴리오 (Portfolio)</h3>
                    </div>
                    <div class="card-body">
                        <div id="portfolio-output" class="content-preview"></div>
                    </div>
                </div>
            </section>
        </main>

        <!-- 푸터 영역 -->
        <footer class="app-footer">
            <p>&copy; 2026 AI Resume & Portfolio Builder. Powered by Flask & Google Gemini API.</p>
        </footer>
    </div>

    <!-- 마크다운 렌더링 라이브러리 (marked.js) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 정적 자바스크립트 연결 -->
    <script src="/static/js/app.js"></script>
    <!-- PWA Service Worker 등록 -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((reg) => console.log('[PWA] Service Worker 등록 완료:', reg.scope))
                    .catch((err) => console.warn('[PWA] Service Worker 등록 실패:', err));
            });
        }
    </script>
</body>
</html>
